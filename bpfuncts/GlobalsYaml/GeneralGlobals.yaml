# Conversion factor for inch to millimeter
in_to_mm: 25.4
#
# File name of countries attributes
countries_info: Countries.xlsx
#
# Columns name of the file of countries attributes
countries_col_names:
  country    : Country
  short_name : Short name
  gps        : GPS Coordinates
  zip_letters: Zip code letters
  zip_digits : Zip code digits
  continent  : Continent
#
# Folder name where useful files are located
rep_utils: RefFiles
#
# USA-states accronyms
usa_states: AL,AK,AZ,AR,CA,CO,CT,DE,FL,GA,HI,ID,IL,IN,IA,KS,KY,LA,ME,MD,MA,MI,MN,MS,MO,MT,NE,NV,NH,NJ,NM,NY,NC,ND,OH,OK,OR,PA,RI,SC,SD,TN,TX,UT,VT,VA,WA,WV,WI,WY
#
# USA-country aliases
usa_aliases_list:
    - UNITED STATES
    - United States of America
    - USA
