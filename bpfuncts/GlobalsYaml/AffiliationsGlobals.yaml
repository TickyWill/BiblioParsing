# Word to indicate that raw affiliations are all normalized for a given address
empty: empty
#
# Column names of affiliations
affil_col_names:
  norm_affil_col: Norm affiliations
  raw_affil_col_base: Raw affiliations
#
# File names of data for affiliations normalization
affil_default_files_dic:
  country_towns_file: Country_towns.xlsx
  country_affils_file: Country_affiliations.xlsx
  institute_affils_file: Institute_affiliations.xlsx
  affil_types_file: Affiliations_types.xlsx
#
# Column names of useful data setting affiliations types
